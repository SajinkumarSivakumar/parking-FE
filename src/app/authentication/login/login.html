<div
        class="min-h-screen bg-cover bg-center flex items-center justify-center relative"
        style="background-image: url('https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=1920&q=80');"
>
    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/70"></div>


        <div
                class="relative z-10 w-full max-w-md mx-5 rounded-3xl bg-black/40 backdrop-blur-xl border border-orange-500/30 shadow-2xl p-8"
        >

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div
                        class="w-20 h-20 rounded-full bg-orange-500 flex items-center justify-center shadow-xl"
                >
                    <span class="text-4xl">🚗</span>
                </div>
            </div>

            <!-- Title -->
            <h2 class="text-4xl font-bold text-center text-white">
                Car Parking
            </h2>

            <p class="text-center text-gray-300 mt-2 mb-8">
                Smart Parking Management System
            </p>



            <form [formGroup]="login">

                <div class="mb-5">
                    <label class="block text-gray-200 mb-2 font-medium">
                        Email Address
                    </label>

                    <input  formControlName="email"
                            type="email"
                            placeholder="Enter your email"
                            class="w-full px-4 py-3 rounded-xl bg-gray-900/70 border border-gray-600 text-white placeholder-gray-400 focus:border-orange-500 focus:ring-2 focus:ring-orange-500 outline-none transition"
                    />

                    <p
                            *ngIf="login.get('email')?.hasError('required') && login.get('email')?.touched"
                            style="color: red;"
                    >
                        Email is Required
                    </p>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block text-gray-200 mb-2 font-medium">
                        Password
                    </label>

                    <!-- Parent should be relative -->
                    <div class="relative">

                        <input
                                formControlName="password"
                                [type]="showPassword ? 'text' : 'password'"
                                placeholder="Enter your password"
                                class="w-full px-4 py-3 pr-12 rounded-xl bg-gray-900/70 border border-gray-600 text-white placeholder-gray-400 focus:border-orange-500 focus:ring-2 focus:ring-orange-500 outline-none transition"
                        />

                        <button
                                type="button"
                                (click)="showPassword = !showPassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-orange-500"
                        >
                            {{ showPassword ? '🙈' : '👁️' }}
                        </button>

                    </div>

                    <p
                            *ngIf="login.get('password')?.hasError('required') && login.get('password')?.touched"
                            class="text-red-500 text-sm mt-1"
                    >
                        Password is Required
                    </p>
                </div>



                <!-- Login Button -->
                <button (click)="submitLogin()"
                        class="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-lg shadow-lg transition duration-300"
                >
                    Login
                </button>

                <!-- Divider -->
                <div class="flex items-center my-6">
                    <div class="flex-1 border-t border-gray-600"></div>
                    <span class="px-4 text-gray-400 text-sm">OR</span>
                    <div class="flex-1 border-t border-gray-600"></div>
                </div>


<!--                <button (click)="newRegister()"-->
<!--                        class="w-full py-3 rounded-xl border border-orange-500 text-orange-400 hover:bg-orange-500 hover:text-white transition duration-300 font-semibold"-->
<!--                >-->
<!--                    Create New Account-->
<!--                </button>-->


                <div class="text-center mt-8 text-gray-500 text-sm">
                    © 2026 Car Parking System
                </div>


            </form>



            <!-- Email -->

        </div>


</div>
