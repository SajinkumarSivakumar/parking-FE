<div
        class="min-h-screen bg-cover bg-center flex items-center justify-center relative"
        style="background-image: url('https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=1920&q=80');"
>
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/75"></div>

    <!-- Register Card -->

    <form [formGroup]="register">

        <div
                class="relative z-10 w-full max-w-lg mx-5 rounded-3xl bg-black/60 backdrop-blur-xl border border-orange-500/40 shadow-2xl p-8"
        >
            <!-- Logo -->
            <div class="flex justify-center mb-5">
                <div
                        class="w-20 h-20 rounded-full bg-orange-500 flex items-center justify-center shadow-xl"
                >
                    <span class="text-4xl">🚗</span>
                </div>
            </div>

            <h1 class="text-4xl font-bold text-center text-white">
                Create Account
            </h1>

            <p class="text-center text-gray-400 mt-2 mb-8">
                Register to Car Parking Management System
            </p>

            <!-- First & Last Name -->
            <div class="grid grid-cols-2 gap-4 mb-5">

                <div>
                    <label class="block text-gray-200 mb-2 font-medium">
                        First Name
                    </label>

                    <input formControlName="firstName"
                            type="text"
                            placeholder="John"
                            class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"
                    />


                    <p *ngIf="register.get('firstName').hasError('required')&& register.get('firstName').touched">
                        FirstName as Required
                    </p>
                </div>

                <div>
                    <label class="block text-gray-200 mb-2 font-medium">
                        Last Name
                    </label>

                    <input  formControlName="lastName"
                            type="text"
                            placeholder="Doe"
                            class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"
                    />
                </div>
                <p *ngIf="register.get('lastName').hasError('required')&& register.get('lastName').touched">
                    LastName as Required
                </p>

            </div>

            <div>
                <div>
                    <label class="block text-gray-200 mb-2 font-medium">
                       Email
                    </label>

                    <input  formControlName="email"
                            type="text"
                            placeholder="Doe"
                            class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"
                    />
                </div>
                <p *ngIf="register.get('email').hasError('required')&& register.get('email').touched">
                    Email as Required
                </p>
            </div>




            <!-- Password -->
            <div class="mb-5">

                <label class="block text-gray-200 mb-2 font-medium">
                    Password
                </label>

                <div class="relative">

                    <input
                            formControlName="password"
                            [type]="showPassword ? 'text' : 'password'"
                            placeholder="Enter Password"
                            class="w-full px-4 py-3 pr-12 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"
                    />

                    <!-- Eye Icon -->
                    <button
                            type="button"
                            (click)="showPassword = !showPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-orange-500"
                    >
                        {{ showPassword ? '🙈' : '👁️' }}
                    </button>

                </div>

                <p
                        class="text-red-500 text-sm mt-1"
                        *ngIf="register.get('password')?.hasError('required') && register.get('password')?.touched"
                >
                    Password is required
                </p>

            </div>

            <!-- Confirm Password -->
            <div class="mb-6">

                <label class="block text-gray-200 mb-2 font-medium">
                    Confirm Password
                </label>

                <div class="relative">

                    <input
                            formControlName="confirmPassword"
                            [type]="showConfirmPassword ? 'text' : 'password'"
                            placeholder="Confirm Password"
                            class="w-full px-4 py-3 pr-12 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"
                    />

                    <button
                            type="button"
                            (click)="showConfirmPassword = !showConfirmPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-orange-500"
                    >
                        {{ showConfirmPassword ? '🙈' : '👁️' }}
                    </button>

                </div>

                <p
                        class="text-red-500 text-sm mt-1"
                        *ngIf="register.get('confirmPassword')?.hasError('required') && register.get('confirmPassword')?.touched"
                >
                    Confirm Password is required
                </p>

            </div>

            <!-- Register Button -->
            <button (click)="SaveRegister()"
                    class="w-full bg-orange-500 hover:bg-orange-600 hover:scale-105 transition duration-300 text-white font-bold py-3 rounded-xl shadow-lg"
            >
                Create Account
            </button>

            <!-- Divider -->
            <div class="flex items-center my-6">
                <div class="flex-1 border-t border-gray-700"></div>
                <span class="mx-4 text-gray-500">OR</span>
                <div class="flex-1 border-t border-gray-700"></div>
            </div>

            <!-- Login Link -->
            <div class="text-center text-gray-300">

                Already have an account?

                <a

                        class="text-orange-400 hover:text-orange-300 font-semibold ml-1"
                >
                    Login
                </a>

            </div>

            <!-- Footer -->
            <div class="mt-8 text-center text-gray-500 text-sm">
                © 2026 Car Parking System
            </div>

        </div>

    </form>



</div>
