<app-shared></app-shared>
<br><br><br>

<div class="min-h-screen bg-slate-100">

    <!-- ================= HEADER ================= -->
    <div class="bg-white border-b border-slate-200 shadow-sm">
        <div class="px-6 lg:px-10 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                <!-- Left -->
                <div>
                    <p class="text-sm font-medium text-slate-500">
                        Master / Parking Configurations
                    </p>

                    <h1 class="text-2xl lg:text-3xl font-bold text-slate-800 mt-1">
                        Add Parking Configurations
                    </h1>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-3">

                    <button
                            type="button"
                            class="inline-flex items-center gap-2
                   px-5 py-2.5
                   rounded-lg
                   bg-blue-600
                   hover:bg-blue-700
                   text-white
                   text-sm font-semibold
                   shadow-sm
                   hover:shadow-md
                   transition-all duration-200
                   cursor-pointer">

                        <!-- List Icon -->
                        <svg
                                class="w-4 h-4"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">

                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16" />

                        </svg>

                        Go To Manage

                    </button>


                    <button
                            type="button"
                            class="inline-flex items-center gap-2
                   px-6 py-2.5
                   rounded-lg
                   bg-gradient-to-r from-emerald-500 to-teal-600
                   hover:from-emerald-600 hover:to-teal-700
                   text-white
                   text-sm font-semibold
                   shadow-sm
                   hover:shadow-md
                   transition-all duration-200
                   cursor-pointer">

                        <!-- Save Icon -->
                        <svg
                                class="w-4 h-4"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">

                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M5 13l4 4L19 7" />

                        </svg>

                        Save Parking Configurations

                    </button>

                    <button
                            type="button"
                            class="inline-flex items-center gap-2
                   px-6 py-2.5
                   rounded-lg
                   bg-gradient-to-r from-emerald-500 to-teal-600
                   hover:from-emerald-600 hover:to-teal-700
                   text-white
                   text-sm font-semibold
                   shadow-sm
                   hover:shadow-md
                   transition-all duration-200
                   cursor-pointer">

                        <!-- Save Icon -->
                        <svg
                                class="w-4 h-4"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">

                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M5 13l4 4L19 7" />

                        </svg>

                        Update Parking Configurations

                    </button>

                </div>

            </div>
        </div>
    </div>



    <form [formGroup]="parking"  class="p-6 lg:p-8">
        <div class="mb-8">

            <div class="flex items-center gap-2 mb-5">

                <div class="w-1 h-5 rounded-full bg-blue-600"></div>

                <h3 class="text-lg font-bold text-slate-800">
                    Basic Information
                </h3>

            </div>


            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">


                <!-- Branch Name -->
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                        Branch

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="branch"
                           type="text"
                           placeholder="Enter branch name"
                           class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                        Address

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="address"
                           type="text"
                           placeholder="Enter branch name"
                           class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                        City

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="city"
                           type="text"
                           placeholder="Enter branch name"
                           class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                        Parking Name

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="parkingName"
                            type="text"
                            placeholder="Enter branch name"
                            class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                        Parking Type

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="parkingType"
                            type="text"
                            placeholder="Enter branch name"
                            class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                       Total Floors

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="totalFloors"
                            type="text"
                            placeholder="Enter branch name"
                            class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                        Total Capacity

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="totalCapacity"
                            type="text"
                            placeholder="Enter branch name"
                            class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>

                <!-- Slot Prefix -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Slot Prefix
                        <span class="text-red-500">*</span>
                    </label>

                    <input
                            formControlName="slotPrefix"
                            type="text"
                            placeholder="Enter slot prefix (e.g. P1)"
                            class="w-full h-12
           px-4
           rounded-lg
           border border-slate-300
           bg-white
           text-base
           text-slate-800
           placeholder:text-slate-400
           outline-none
           focus:border-blue-500
           focus:ring-2
           focus:ring-blue-100
           transition-all duration-200"
                    />
                </div>

                <div>

                    <label
                            class="block text-sm font-semibold text-slate-700 mb-2">

                      Status

                        <span class="text-red-500">*</span>

                    </label>

                    <input formControlName="status"
                            type="text"
                            placeholder="Enter branch name"
                            class="w-full h-12
                       px-4
                       rounded-lg
                       border border-slate-300
                       bg-white
                       text-base
                       text-slate-800
                       placeholder:text-slate-400
                       outline-none
                       focus:border-blue-500
                       focus:ring-2
                       focus:ring-blue-100
                       transition-all duration-200" />

                </div>
            </div>

        </div>
    </form>

</div>
